name: refresh-instagram-token

on:
  schedule:
    - cron: '0 0 1 * *'   # 1st of every month at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refresh Long-Lived Meta Token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$FB_APP_ID" ] || [ -z "$FB_APP_SECRET" ]; then
            echo "FB_APP_ID or FB_APP_SECRET missing. Skipping automatic token exchange."
            exit 0
          fi

          RESPONSE=$(curl -s "https://graph.facebook.com/v20.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${FB_APP_ID}&client_secret=${FB_APP_SECRET}&fb_exchange_token=${IG_ACCESS_TOKEN}")
          NEW_TOKEN=$(echo "$RESPONSE" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)

          if [ -n "$NEW_TOKEN" ]; then
            echo "Token refreshed successfully. Updating repository secret..."
            echo "$NEW_TOKEN" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
            echo "Secret IG_ACCESS_TOKEN updated."
          else
            echo "ERROR: Failed to refresh token: $RESPONSE"
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=🚨 <b>Meta Token Refresh Failed</b>: Please review your Instagram Developer credentials." \
                -d "parse_mode=HTML"
            fi
            exit 1
          fi
