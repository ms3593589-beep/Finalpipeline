name: instagram-pipeline

on:
  schedule:
    - cron: '30 1 * * *'    # 01:30 UTC / 07:00 IST, Morning News
  workflow_dispatch:
    inputs:
      live_publish:
        description: '🚀 LIVE PUBLISH TO INSTAGRAM (Uncheck for Dry-Run Test)'
        required: true
        type: boolean
        default: true
      forced_slot:
        description: 'Slot execution (auto, slot1)'
        required: true
        type: choice
        options: [auto, slot1]
        default: auto
  repository_dispatch:
    types: [manual_override, trigger_slot]

permissions:
  contents: write

concurrency:
  group: ig-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCED_SLOT: ${{ github.event.inputs.forced_slot || github.event.client_payload.slot || 'auto' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.live_publish == false && 'true' || 'false') || github.event.inputs.dry_run || 'false' }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py

      - name: Upload dry-run preview artifact
        uses: actions/upload-artifact@v4
        if: env.DRY_RUN == 'true'
        with:
          name: mock_preview
          path: mock_preview/
          if-no-files-found: ignore

      - name: Commit pipeline state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in last_processed_id.txt usage.json run_state.json heartbeat.txt state/news_history.json; do [ -f "$f" ] && git add "$f"; done || true
          git diff --cached --quiet || (git commit -m "chore: pipeline state update [skip ci]" && git pull --rebase && git push)
